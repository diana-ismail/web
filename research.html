    <style>
        body {
            overflow-y: auto;
        }

        #research {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 1000px;
            margin: 60px auto;
            padding: 50px;
            background: rgba(27, 31, 34, 0.85);
            border-radius: 5px;
        }

        #research h1 {
            margin-bottom: 25px;
        }

        #research > p {
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* Research sections */
        .research-item {
            display: flex;
            align-items: flex-start;
            gap: 35px;
            padding: 35px 0;
            border-bottom: 1px solid
                rgba(255, 255, 255, 0.15);
        }

        .research-text {
            flex: 1;
            min-width: 0;
        }

        .research-text h2 {
            margin-bottom: 15px;
        }

        .research-text p {
            font-size: 1rem;
            line-height: 1.8;
            text-align: justify;
        }

        /* Figures on the right */
        .research-figure {
            width: 38%;
            flex-shrink: 0;
            margin: 0;
        }

        .research-figure img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        .research-figure figcaption {
            margin-top: 10px;
            font-size: 0.8rem;
            line-height: 1.5;
            opacity: 0.7;
            text-align: center;
        }

        /* Mobile layout */
        @media screen and (max-width: 736px) {
            #research {
                padding: 25px;
                margin: 30px auto;
            }

            .research-item {
                flex-direction: column;
                gap: 20px;
            }

            .research-figure {
                width: 100%;
            }
        }
    </style>
</head>
